<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Подходишь ли ты под банкротство?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .quiz-container { background: #ffffff; max-width: 600px; width: 100%; padding: 40px 30px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .question-text { font-size: 22px; font-weight: 700; color: #1a1a1a; text-align: center; margin-bottom: 35px; line-height: 1.4; }
        .answers-list { display: flex; flex-direction: column; gap: 14px; }
        .answer-btn { width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; padding: 18px 24px; text-align: left; font-size: 16px; font-weight: 500; color: #334155; border-radius: 12px; cursor: pointer; transition: all 0.2s ease-in-out; outline: none; }
        .answer-btn:hover { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; transform: translateY(-1px); }
        .hidden { display: none !important; }
        .result-screen, .calendar-section, .form-section { text-align: center; }
        .percentage-box { font-size: 48px; font-weight: 800; color: #ef4444; background: #fef2f2; padding: 15px; border-radius: 12px; margin: 20px 0; }
        .cta-btn { display: inline-block; width: 100%; background: #28a745; color: white; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; text-decoration: none; border: none; }
        .day-tab { padding: 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; display: inline-block; margin: 5px; }
        .day-tab.active { background: #3b82f6; color: white; }
        .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .slot { padding: 12px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; }
        .slot.selected { background: #3b82f6; color: white; }
        .slot.booked { background: #e2e8f0; color: #94a3b8; text-decoration: line-through; }
        .input-field { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div id="step-1">
        <div class="question-text">Какова общая сумма ваших открытых задолженностей?</div>
        <div class="answers-list">
            <button class="answer-btn" onclick="saveAnswer(1, 1)">До 300 000 рублей</button>
            <button class="answer-btn" onclick="saveAnswer(1, 2)">От 300 000 до 500 000 рублей</button>
            <button class="answer-btn" onclick="saveAnswer(1, 3)">Более 500 000 рублей</button>
        </div>
    </div>
    <div id="step-2" class="hidden"><div class="question-text">Каков период вашей задержки?</div><div class="answers-list"><button class="answer-btn" onclick="saveAnswer(2, 1)">Меньше 1 мес.</button><button class="answer-btn" onclick="saveAnswer(2, 2)">1-3 мес.</button><button class="answer-btn" onclick="saveAnswer(2, 3)">Свыше 3 мес.</button></div></div>
    <div id="step-3" class="hidden"><div class="question-text">Хватает ли дохода на оплату?</div><div class="answers-list"><button class="answer-btn" onclick="saveAnswer(3, 1)">Да, впритык</button><button class="answer-btn" onclick="saveAnswer(3, 2)">Частично</button><button class="answer-btn" onclick="saveAnswer(3, 3)">Нет</button></div></div>
    <div id="step-4" class="hidden"><div class="question-text">Есть ли взыскания у приставов?</div><div class="answers-list"><button class="answer-btn" onclick="saveAnswer(4, 1)">Нет</button><button class="answer-btn" onclick="saveAnswer(4, 2)">Да, одно</button><button class="answer-btn" onclick="saveAnswer(4, 3)">Да, активно</button></div></div>
    <div id="result-block" class="result-screen hidden">
        <h2>Ваш уровень соответствия:</h2>
        <div id="percentage" class="percentage-box">0%</div>
        <p id="description" style="margin-bottom:20px;"></p>
        <button onclick="openCalendar()" class="cta-btn">Записаться</button>
    </div>
    <div id="calendar-block" class="calendar-section hidden">
        <h3>Выберите дату и время</h3>
        <div id="days-tabs"></div>
        <div class="time-slots" id="slots-container"></div>
        <button onclick="openForm()" class="cta-btn">Далее</button>
    </div>
    <div id="form-block" class="form-section hidden">
        <h3>Введите ваши данные</h3>
        <input type="text" id="client-name" class="input-field" placeholder="Имя">
        <input type="text" id="client-contact" class="input-field" placeholder="+7... или ://vk.com">
        <button onclick="submitToYandex()" class="cta-btn" style="margin-top:20px;">Отправить</button>
    </div>
</div>
<script>
    const YANDEX_FORM_BASE_URL = "https://yandex.ru";
    const FIELD_NAME_ID = "answer_short_text_146197177";
    const FIELD_PHONE_ID = "answer_short_text_146197204";
    const FIELD_VK_ID = "answer_short_text_146197216";
    const FIELD_DATE_ID = "answer_date_146197232";
    const FIELD_TIME_ID = "answer_choices_146197255";
    var totalScore = 0, currentStep = 1, selectedDateLabel = "", selectedTime = "";
    const today = new Date(), months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
    const daysData = [{ label: `${today.getDate()} ${months[today.getMonth()]}`, dateObj: today }, { label: `${tomorrow.getDate()} ${months[tomorrow.getMonth()]}`, dateObj: tomorrow }];
    function saveAnswer(step, score) {
        totalScore += score;
        document.getElementById("step-" + step).classList.add("hidden");
        if (step === 4) {
            document.getElementById("result-block").classList.remove("hidden");
            let p = Math.round(60 + ((totalScore - 4) / 8) * 40);
            document.getElementById("percentage").innerText = p + "%";
            document.getElementById("description").innerText = p >= 85 ? "Идеально подходит." : (p >= 70 ? "Высокая вероятность." : "Требует проверки.");
        } else { document.getElementById("step-" + (step + 1)).classList.remove("hidden"); }
    }
    function openCalendar() {
        document.getElementById("result-block").classList.add("hidden");
        document.getElementById("calendar-block").classList.remove("hidden");
        const tabsContainer = document.getElementById("days-tabs");
        tabsContainer.innerHTML = "";
        daysData.forEach((day, index) => {
            const btn = document.createElement("div");
            btn.className = `day-tab ${index === 0 ? 'active' : ''}`;
            btn.innerText = day.label;
            btn.onclick = () => {
                document.querySelectorAll('.day-tab').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                selectedDateLabel = day.label;
                renderSlots();
            };
            tabsContainer.appendChild(btn);
        });
        selectedDateLabel = daysData[0].label;
        renderSlots();
    }
    function renderSlots() {
        const slotsContainer = document.getElementById("slots-container");
        slotsContainer.innerHTML = "";
        const hours = ["10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];
        hours.forEach(hour => {
            const slotEl = document.createElement("div");
            slotEl.className = "slot";
            slotEl.innerText = hour;
            slotEl.onclick = () => {
                document.querySelectorAll('.slot').forEach(el => el.classList.remove('selected'));
                slotEl.classList.add('selected');
                selectedTime = hour;
            };
            slotsContainer.appendChild(slotEl);
        });
    }
    function openForm() { if (selectedTime) { document.getElementById("calendar-block").classList.add("hidden"); document.getElementById("form-block").classList.remove("hidden"); } else alert("Выберите время"); }
    function submitToYandex() {
        const name = document.getElementById("client-name").value.trim(), contact = document.getElementById("client-contact").value.trim();
        if (!name || !contact) { alert("Заполните все поля"); return; }
        let activeDayObj = daysData.find(d => d.label === selectedDateLabel).dateObj;
        let formattedDate = `${activeDayObj.getFullYear()}-${String(activeDayObj.getMonth() + 1).padStart(2, '0')}-${String(activeDayObj.getDate()).padStart(2, '0')}`;
        let vk = contact.includes("vk.com") || contact.includes("vk.me") || contact.includes("/") ? contact : "";
        let phone = vk ? "" : contact;
        window.open(`${YANDEX_FORM_BASE_URL}?${FIELD_NAME_ID}=${encodeURIComponent(name)}&${FIELD_PHONE_ID}=${encodeURIComponent(phone)}&${FIELD_VK_ID}=${encodeURIComponent(vk)}&${FIELD_DATE_ID}=${encodeURIComponent(formattedDate)}&${FIELD_TIME_ID}=${encodeURIComponent(selectedTime)}`, '_blank');
    }
</script>
</body>
</html>
