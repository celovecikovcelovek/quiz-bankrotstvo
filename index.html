<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Подходишь ли ты под банкротство?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .quiz-container { background: #ffffff; max-width: 600px; width: 100%; padding: 40px 30px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .question-text { font-size: 22px; font-weight: 700; color: #1a1a1a; text-align: center; margin-bottom: 35px; line-height: 1.4; }
        .answers-list { display: flex; flex-direction: column; gap: 14px; }
        .answer-btn { width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; padding: 18px 24px; text-align: left; font-size: 16px; font-weight: 500; color: #334155; border-radius: 12px; cursor: pointer; transition: all 0.2s ease-in-out; outline: none; }
        .answer-btn:hover { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; transform: translateY(-1px); }
        .hidden { display: none !important; }
        .result-screen { text-align: center; padding: 20px 0; }
        .result-screen h2 { font-size: 26px; color: #1e293b; margin-bottom: 15px; }
        .percentage-box { display: inline-block; font-size: 48px; font-weight: 800; color: #ef4444; background: #fef2f2; padding: 15px 30px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #fee2e2; }
        .result-desc { font-size: 16px; color: #64748b; line-height: 1.6; margin-bottom: 30px; }
        .cta-btn { display: inline-block; width: 100%; background: #28a745; color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; text-decoration: none; transition: background 0.2s; text-align: center; }
        .cta-btn:hover { background: #218838; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div id="step-1">
        <div class="question-text">Какова общая сумма ваших открытых задолженностей?</div>
        <div class="answers-list">
            <button class="answer-btn" onclick="saveAnswer(1, 1, 'До 300 000 рублей')">До 300 000 рублей</button>
            <button class="answer-btn" onclick="saveAnswer(1, 2, 'От 300 000 до 500 000 рублей')">От 300 000 до 500 000 рублей</button>
            <button class="answer-btn" onclick="saveAnswer(1, 3, 'Более 500 000 рублей')">Более 500 000 рублей</button>
        </div>
    </div>
    <div id="step-2" class="hidden">
        <div class="question-text">Каков период вашей задержки по регулярным выплатам?</div>
        <div class="answers-list">
            <button class="answer-btn" onclick="saveAnswer(2, 1, 'Меньше 1 месяца')">Меньше 1 месяца</button>
            <button class="answer-btn" onclick="saveAnswer(2, 2, 'От 1 до 3 месяцев')">От 1 до 3 месяцев</button>
            <button class="answer-btn" onclick="saveAnswer(2, 3, 'Свыше 3 месяцев')">Свыше 3 месяцев</button>
        </div>
    </div>
    <div id="step-3" class="hidden">
        <div class="question-text">Хватает ли вашего официального дохода на оплату всех платежей?</div>
        <div class="answers-list">
            <button class="answer-btn" onclick="saveAnswer(3, 1, 'Да, но живу впритык')">Да, но живу впритык</button>
            <button class="answer-btn" onclick="saveAnswer(3, 2, 'Частично, приходится занимать')">Частично, приходится занимать</button>
            <button class="answer-btn" onclick="saveAnswer(3, 3, 'Нет, денег совсем не хватает')">Нет, денег совсем не хватает</button>
        </div>
    </div>
    <div id="step-4" class="hidden">
        <div class="question-text">Имеются ли у вас открытые исполнительные производства у приставов?</div>
        <div class="answers-list">
            <button class="answer-btn" onclick="saveAnswer(4, 1, 'Нет, приставы еще не беспокоят')">Нет, приставы еще не беспокоят</button>
            <button class="answer-btn" onclick="saveAnswer(4, 2, 'Да, запущено одно производство')">Да, запущено одно производство</button>
            <button class="answer-btn" onclick="saveAnswer(4, 3, 'Да, идет активное взыскание / арест счетов')">Да, идет активное взыскание / арест счетов</button>
        </div>
    </div>
    <div id="result-block" class="result-screen hidden">
        <h2>Ваш уровень соответствия условиям банкротства:</h2>
        <div id="percentage" class="percentage-box">0%</div>
        <p id="description" class="result-desc"></p>
        <button onclick="goToYandexForm()" class="cta-btn">Записаться на бесплатную консультацию</button>
    </div>
</div>
<script>
    var totalScore = 0;
    var calculatedPercentage = 0;

    function saveAnswer(step, score, text) {
        totalScore += score;
        document.getElementById("step-" + step).classList.add("hidden");

        if (step === 4) {
            document.getElementById("result-block").classList.remove("hidden");
            var minPoints = 4; var maxPoints = 12;
            calculatedPercentage = Math.round(60 + ((totalScore - minPoints) / (maxPoints - minPoints)) * 40);
            document.getElementById("percentage").innerText = calculatedPercentage + "%";

            var textBlock = document.getElementById("description");
            if (calculatedPercentage >= 85) { 
                textBlock.innerText = "Вы идеально подходите под федеральную программу списания долгов. Закон на вашей стороне, вероятность успешного завершения дела максимально высока."; 
            } else if (calculatedPercentage >= 70) { 
                textBlock.innerText = "У вас высокая вероятность прохождения процедуры банкротства. Большинство задолженностей могут быть полностью списаны."; 
            } else { 
                textBlock.innerText = "Вы подходите под базовые критерии банкротства. Ситуация требует анализа документов юридической службой."; 
            }
        } else {
            var nextStep = step + 1;
            document.getElementById("step-" + nextStep).classList.remove("hidden");
        }
    }

    function goToYandexForm() {
        window.location.href = "https://forms.yandex.ru/u/6a6631fc6d2d73f6be16f89e";
    }
</script>
</body>
</html>
